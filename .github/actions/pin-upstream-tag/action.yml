name: Pin upstream tag
description: Rewrites snap/snapcraft.yaml to package a specific hrzlgnm/mdns-browser tag
inputs:
  tag:
    description: Upstream tag to pin, e.g. v1.19.0. Defaults to the latest upstream release.
    required: false
    default: ""
runs:
  using: composite
  steps:
    - shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        INPUT_TAG: ${{ inputs.tag }}
        UPSTREAM_REPO: hrzlgnm/mdns-browser
      run: |
        set -euo pipefail
        auth=(-H "Authorization: Bearer $GH_TOKEN")
        if [ -z "$INPUT_TAG" ]; then
            TAG="$(curl -fsSL "${auth[@]}" \
                "https://api.github.com/repos/$UPSTREAM_REPO/releases/latest" \
                | python3 -c 'import json, sys; print(json.load(sys.stdin)["tag_name"])')"
        else
            TAG="$INPUT_TAG"
        fi
        curl -fsSL "${auth[@]}" \
            "https://api.github.com/repos/$UPSTREAM_REPO/git/ref/tags/$TAG" > /dev/null
        sed -i "s|^    source-tag: .*|    source-tag: $TAG|" snap/snapcraft.yaml
        echo "Pinned snap source to $TAG:"
        grep '^    source-tag:' snap/snapcraft.yaml
