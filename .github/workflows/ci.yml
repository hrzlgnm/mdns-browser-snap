name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  typos:
    name: 📝 Check typos
    if: always()
    uses: hrzlgnm/actions/.github/workflows/typos-reusable.yml@1847f299d36e715acd93d4bc496b9faab29a4c94 # v2.6.0

  actionlint:
    if: always()
    uses: hrzlgnm/actions/.github/workflows/actionlint-reusable.yml@1847f299d36e715acd93d4bc496b9faab29a4c94 # v2.6.0

  build:
    name: 🔨 Build snap
    runs-on: ubuntu-latest
    container:
      image: ubuntu:24.04
    needs:
      - actionlint
    steps:
      - name: Install snapcraft and tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
              ca-certificates curl git jq python3-pip
          pip install --break-system-packages --root-user-action=ignore \
              git+https://github.com/canonical/snapcraft
        shell: bash

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Pin snap source to latest upstream release
        uses: ./.github/actions/pin-upstream-tag

      - name: Build snap
        # The job container is the isolation; no managed build instance needed.
        run: snapcraft --destructive-mode --verbosity=brief
        shell: bash

      - name: Upload snap artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: snap-amd64
          path: "*.snap"
          if-no-files-found: error
