name: mdns-browser
base: core24
adopt-info: mdns-browser
summary: Cross-platform mDNS browsing app
description: |
  A cross platform mDNS browsing app written in Rust using tauri and leptos.

  Browse services advertised via mDNS on your local network.
grade: stable
confinement: strict
platforms:
  amd64:

apps:
  mdns-browser:
    command: bin/mdns-browser
    extensions: [gnome]
    plugs:
      - network
      - network-bind

parts:
  mdns-browser:
    plugin: nil
    source: https://github.com/hrzlgnm/mdns-browser.git
    # CI rewrites this line to the release tag being packaged; the commit is
    # pinned separately via source-commit for integrity.
    source-tag: v1.19.0
    override-pull: |
      craftctl default
      version="$(git describe --tags --exact-match 2>/dev/null | sed 's/^v//')"
      if [ -z "$version" ]; then
          echo "The checked out source has no tag; refusing to guess a version" >&2
          exit 1
      fi
      craftctl set version="$version"
    override-build: |
      set -eu
      export RUSTUP_HOME="$CRAFT_PART_BUILD/rustup-home"
      export CARGO_HOME="$CRAFT_PART_BUILD/cargo-home"
      curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
          | sh -s -- -y --profile minimal --default-toolchain stable
      export PATH="$CARGO_HOME/bin:$PATH"
      rustup target add wasm32-unknown-unknown

      # Version pins mirror the main repository's CI (.github/actions/setup-tauri).
      cargo install --locked trunk --version 0.21.14 \
          --no-default-features --features rustls
      cargo install --locked tauri-cli --version 2.11.4

      cargo --locked tauri build --no-bundle --no-sign

      install -Dm755 target/release/mdns-browser \
          "$CRAFT_PART_INSTALL/bin/mdns-browser"

      install -d "$CRAFT_PART_INSTALL/meta/gui" \
          "$CRAFT_PART_INSTALL/share/man/man1"
      install -m644 src-tauri/icons/128x128.png \
          "$CRAFT_PART_INSTALL/meta/gui/icon.png"
      install -m644 docs/mdns-browser.1 \
          "$CRAFT_PART_INSTALL/share/man/man1/mdns-browser.1"

      cat > "$CRAFT_PART_INSTALL/meta/gui/mdns-browser.desktop" <<EOF
      [Desktop Entry]
      Type=Application
      Name=mDNS-Browser
      Comment=Browse services advertised via mDNS on your network
      Exec=mdns-browser %U
      Icon=\${SNAP}/meta/gui/icon.png
      Categories=Network;Utility;
      Terminal=false
      StartupWMClass=mdns-browser
      EOF
    build-packages:
      - build-essential
      - curl
      - file
      - git
      - libgtk-3-dev
      - librsvg2-dev
      - libssl-dev
      - libwebkit2gtk-4.1-dev
      - pkg-config
