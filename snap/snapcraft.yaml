name: mdns-browser
base: core24
adopt-info: mdns-browser
title: mDNS-Browser
summary: Cross-platform mDNS browsing app
description: |
  A cross platform mDNS browsing app written in Rust using tauri and leptos.

  Browse services advertised via mDNS on your local network.
website: https://github.com/hrzlgnm/mdns-browser
issues: https://github.com/hrzlgnm/mdns-browser/issues
source-code: https://github.com/hrzlgnm/mdns-browser
contact: https://github.com/hrzlgnm
grade: stable
confinement: strict
license: MIT
platforms:
  amd64:

apps:
  mdns-browser:
    command: bin/mdns-browser
    extensions: [gnome]
    plugs:
      - network
      - network-bind

parts:
  mdns-browser:
    plugin: nil
    source: https://github.com/hrzlgnm/mdns-browser.git
    # CI rewrites this line to the release tag being packaged.
    source-tag: v1.19.0
    override-pull: |
      craftctl default
      version="$(git describe --tags --exact-match 2>/dev/null | sed 's/^v//')"
      if [ -z "$version" ]; then
          echo "The checked out source has no tag; refusing to guess a version" >&2
          exit 1
      fi
      craftctl set version="$version"
    override-build: |
      set -eu
      tag="$(git describe --tags --exact-match)"

      # Same artifact the AUR -bin package ships: the prebuilt,
      # unbundled Linux binary. Running outside a Tauri bundle layout
      # keeps upstream's auto-updater self-disabled; snap refresh owns
      # updates instead.
      asset="mdns-browser_linux_x64"
      url="https://github.com/hrzlgnm/mdns-browser/releases/download/${tag}/${asset}"
      curl -fsSL -o mdns-browser "$url"

      # Verify the binary's SLSA build provenance offline. The attestation
      # bundle and Sigstore trusted root are fetched on the runner (which has
      # a token) and mounted into this LXD build container via the project
      # directory, so gh attestation verify --bundle --custom-trusted-root
      # runs fully offline (no auth, no network); no GH_TOKEN is needed here.
      # core24's apt `gh` (2.45) predates the `attestation` subcommand,
      # so fetch a static CLI build and pin its checksum.
      gh_ver=2.98.0
      gh_tarball="gh_${gh_ver}_linux_amd64.tar.gz"
      curl -fsSL -o "$gh_tarball" \
        "https://github.com/cli/cli/releases/download/v${gh_ver}/${gh_tarball}"
      printf '%s  %s\n' \
        "3b8ac6b30336802fc1a858d7c084e11cdf24ac1a761ca90b68022d7d729208de" \
        "$gh_tarball" | sha256sum --check --status
      tar -xzf "$gh_tarball"
      gh_bin="$(pwd)/gh_${gh_ver}_linux_amd64/bin/gh"

      bundle="$(ls "$SNAPCRAFT_PROJECT_DIR"/sha256*.jsonl | head -1)"
      "$gh_bin" attestation verify mdns-browser \
        --repo hrzlgnm/mdns-browser \
        --bundle "$bundle" \
        --custom-trusted-root "$SNAPCRAFT_PROJECT_DIR/trusted_root.jsonl" \
        --cert-identity "https://github.com/hrzlgnm/mdns-browser/.github/workflows/desktop-reusable.yml@refs/tags/${tag}"

      install -Dm755 mdns-browser "$CRAFT_PART_INSTALL/bin/mdns-browser"

      install -d "$CRAFT_PART_INSTALL/meta/gui" \
          "$CRAFT_PART_INSTALL/share/man/man1"
      install -m644 src-tauri/icons/128x128.png \
          "$CRAFT_PART_INSTALL/meta/gui/icon.png"
      install -m644 docs/mdns-browser.1 \
          "$CRAFT_PART_INSTALL/share/man/man1/mdns-browser.1"

      cat > "$CRAFT_PART_INSTALL/meta/gui/mdns-browser.desktop" <<EOF
      [Desktop Entry]
      Type=Application
      Name=mDNS-Browser
      Comment=Browse services advertised via mDNS on your network
      Exec=mdns-browser %U
      Icon=\${SNAP}/meta/gui/icon.png
      Categories=Network;Utility;
      Terminal=false
      StartupWMClass=mdns-browser
      EOF
    build-packages:
      - ca-certificates
      - curl
      - git
